<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STIA/DTIA Workspace</title>
    <style>
        body { margin: 0; background: #222; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .toolbar { position: sticky; top: 0; width: 100%; background: #000; padding: 15px; display: flex; gap: 10px; justify-content: center; z-index: 1000; color: white; flex-wrap: wrap; }
        
        #workspace { 
            margin: 20px; background: white; position: relative; box-shadow: 0 0 20px black;
            transition: width 0.3s, height 0.3s;
        }
        
        /* כל אלמנט שנוסף הופך לנגרר אוטומטית */
        .item { position: absolute; padding: 5px; cursor: move; touch-action: none; min-width: 20px; }
        .item:hover { outline: 1px dashed #aaa; }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="setCanvasSize(297, 210)">תעודה (A4 לרוחב)</button>
    <button onclick="setCanvasSize(210, 297)">מסמך (A4 לאורך)</button>
    <button onclick="addText()">+ טקסט</button>
    <label style="cursor:pointer; background:#444; padding:5px 10px; border-radius:3px;">
        + תמונה/לוגו
        <input type="file" id="imgLoader" accept="image/*" style="display:none" onchange="uploadImg(event)">
    </label>
    <button onclick="window.print()" style="background:green;">הדפס/שמור כ-PDF</button>
</div>

<div id="workspace" style="width: 297mm; height: 210mm;"></div>

<script>
    const workspace = document.getElementById('workspace');

    function setCanvasSize(w, h) {
        workspace.style.width = w + 'mm';
        workspace.style.height = h + 'mm';
    }

    function addText() {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = '<div contenteditable="true" style="font-size:24px; outline:none; min-width:50px;">טקסט חדש</div>';
        workspace.appendChild(div);
        makeDraggable(div);
    }

    function uploadImg(e) {
        const file = e.target.files[0];
        if (!file) return;
        const div = document.createElement('div');
        div.className = 'item';
        // הוספנו מניעת בחירה כדי שהתמונה לא "תימרח" בזמן גרירה
        div.innerHTML = `<img src="${URL.createObjectURL(file)}" style="max-width:200px; display:block; pointer-events:none;">`;
        workspace.appendChild(div);
        makeDraggable(div);
    }

    function makeDraggable(el) {
        el.onmousedown = el.ontouchstart = (e) => {
            // מאפשר לערוך טקסט בלי לגרור
            if(e.target.getAttribute('contenteditable') === 'true') return;
            
            e.preventDefault();
            let startX = (e.clientX || e.touches[0].clientX) - el.offsetLeft;
            let startY = (e.clientY || e.touches[0].clientY) - el.offsetTop;
            
            const move = (e) => {
                el.style.left = ((e.clientX || e.touches[0].clientX) - startX) + 'px';
                el.style.top = ((e.clientY || e.touches[0].clientY) - startY) + 'px';
            };
            
            document.onmousemove = document.ontouchmove = move;
            document.onmouseup = document.ontouchend = () => {
                document.onmousemove = document.ontouchmove = null;
            };
        };
    }
</script>
</body>
</html>
