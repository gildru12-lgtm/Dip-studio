<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>STIA/DTIA - מרכז עיצוב מלא</title>
    <style>
        body { margin: 0; background: #222; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .toolbar { position: sticky; top: 0; width: 100%; background: #000; padding: 15px; display: flex; gap: 10px; justify-content: center; z-index: 1000; color: white; flex-wrap: wrap; }
        
        #scroll-container { width: 100vw; height: calc(100vh - 80px); overflow: auto; display: flex; justify-content: center; padding: 20px; }
        #workspace { background: white; position: relative; box-shadow: 0 0 20px black; background-size: 100% 100%; flex-shrink: 0; }
        
        .item { position: absolute; padding: 5px; cursor: move; touch-action: none; border: 1px solid transparent; }
        .item:hover { border: 1px dashed #aaa; }
        .resizer { width: 12px; height: 12px; background: blue; position: absolute; right: 0; bottom: 0; cursor: se-resize; }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="setCanvasSize(297, 210)">A4 לרוחב</button>
    <button onclick="setCanvasSize(210, 297)">A4 לאורך</button>
    <button onclick="addText()">+ טקסט</button>
    <button onclick="document.getElementById('fileInput').click()">+ לוגו (חיתוך רקע)</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <button onclick="window.print()" style="background:green;">הדפס / PDF</button>
</div>

<div id="scroll-container">
    <div id="workspace" style="width: 297mm; height: 210mm;"></div>
</div>

<script>
    const workspace = document.getElementById('workspace');

    function setCanvasSize(w, h) { workspace.style.width = w + 'mm'; workspace.style.height = h + 'mm'; }

    // פונקציית הוספת לוגו עם חיתוך רקע אוטומטי
    document.getElementById('fileInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const tr = data[0], tg = data[1], tb = data[2]; // דגימת צבע פינה
                
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.abs(data[i]-tr) < 40 && Math.abs(data[i+1]-tg) < 40 && Math.abs(data[i+2]-tb) < 40) data[i+3] = 0;
                }
                ctx.putImageData(imageData, 0, 0);
                createItem(`<img src="${canvas.toDataURL()}" style="width:100px; pointer-events:none;">`);
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function addText() { createItem('<div contenteditable="true" style="font-size:24px; outline:none; min-width:50px;">טקסט חדש</div>'); }

    function createItem(content) {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = content + '<div class="resizer"></div>';
        workspace.appendChild(div);
        makeDraggable(div);
        makeResizable(div);
    }

    function makeDraggable(el) {
        el.onmousedown = (e) => {
            if(e.target.classList.contains('resizer') || e.target.contentEditable === 'true') return;
            let shiftX = e.clientX - el.offsetLeft;
            let shiftY = e.clientY - el.offsetTop;
            const move = (e) => { el.style.left = (e.clientX - shiftX) + 'px'; el.style.top = (e.clientY - shiftY) + 'px'; };
            document.onmousemove = move;
            document.onmouseup = () => document.onmousemove = null;
        };
    }

    function makeResizable(el) {
        const resizer = el.querySelector('.resizer');
        resizer.onmousedown = (e) => {
            e.stopPropagation();
            const target = el.querySelector('img') || el.querySelector('div');
            const onMove = (e) => { target.style.width = (e.clientX - el.getBoundingClientRect().left) + 'px'; };
            document.onmousemove = onMove;
            document.onmouseup = () => document.onmousemove = null;
        };
    }
</script>
</body>
</html>
