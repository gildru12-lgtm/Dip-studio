<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; background: #333; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; width: 100%; max-width: 1000px; justify-content: center; }
        
        /* הקנבס מקובע לחלוטין */
        #canvas {
            width: 297mm; height: 210mm;
            background-color: white; 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden; /* מונע גלילה מיותרת */
            cursor: default;
        }

        .draggable-item { 
            position: absolute; 
            cursor: move; 
            padding: 5px; 
            z-index: 100;
            user-select: none; /* מונע בחירת טקסט מעצבנת בזמן גרירה */
        }
        
        .font-normal { font-family: Arial; }
        .font-formal { font-family: 'Times New Roman', serif; font-weight: bold; }
        .font-hand { font-family: 'cursive'; }
        .color-gold { color: #D4AF37; text-shadow: 1px 1px 2px #000; }
        .color-black { color: #000; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="bgLoader" accept="image/*"> רקע
    <select id="textColor"><option value="color-gold">זהב</option><option value="color-black">שחור</option></select>
    <select id="textFont"><option value="font-normal">רגיל</option><option value="font-formal">רשמי</option><option value="font-hand">יד</option></select>
    <button onclick="addTextBox()">הוסף טקסט</button>
    <input type="file" id="logoLoader" accept="image/*"> לוגו
</div>

<div id="canvas"></div>

<script>
    const canvas = document.getElementById('canvas');

    document.getElementById('bgLoader').onchange = e => {
        canvas.style.backgroundImage = `url(${URL.createObjectURL(e.target.files[0])})`;
    };

    document.getElementById('logoLoader').onchange = e => {
        const div = document.createElement('div');
        div.className = 'draggable-item';
        div.style.left = "50px"; div.style.top = "50px";
        div.innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:150px; pointer-events:none;">`;
        canvas.appendChild(div);
        initDrag(div);
    };

    function addTextBox() {
        const div = document.createElement('div');
        div.className = `draggable-item ${document.getElementById('textColor').value} ${document.getElementById('textFont').value}`;
        div.style.left = "100px"; div.style.top = "100px";
        div.innerHTML = `
            <div contenteditable="true" style="font-size:30px; outline:none; min-width:50px;">טקסט חדש</div>
            <input type="range" min="10" max="100" value="30" oninput="this.previousElementSibling.style.fontSize = this.value + 'px'">
        `;
        canvas.appendChild(div);
        initDrag(div);
    }

    function initDrag(elmnt) {
        elmnt.onmousedown = function(e) {
            // אם לוחצים על תיבת העריכה או הסליידר, לא נגרור
            if (e.target.contentEditable === "true" || e.target.tagName === "INPUT") return;
            
            let rect = canvas.getBoundingClientRect();
            let shiftX = e.clientX - elmnt.getBoundingClientRect().left;
            let shiftY = e.clientY - elmnt.getBoundingClientRect().top;
            
            function moveAt(pageX, pageY) {
                let x = pageX - shiftX - rect.left;
                let y = pageY - shiftY - rect.top;
                elmnt.style.left = x + 'px';
                elmnt.style.top = y + 'px';
            }
            
            function onMouseMove(e) { moveAt(e.pageX, e.pageY); }
            document.addEventListener('mousemove', onMouseMove);
            document.onmouseup = () => document.removeEventListener('mousemove', onMouseMove);
        };
    }
</script>
</body>
</html>
