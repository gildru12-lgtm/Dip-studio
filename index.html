<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; background: #ddd; padding: 10px; }
        .controls { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        
        #canvas {
            width: 297mm; height: 210mm;
            background: white; background-size: cover; background-position: center;
            position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            overflow: hidden; margin: auto;
        }

        .item { position: absolute; cursor: move; padding: 5px; outline: none; display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.1); }
        .text-box { min-width: 50px; }
        
        /* גופנים וצבעים */
        .font-normal { font-family: Arial; }
        .font-formal { font-family: 'Times New Roman', serif; font-weight: bold; }
        .font-hand { font-family: 'cursive'; }
        .color-gold { color: #D4AF37; text-shadow: 1px 1px 2px #000; }
        .color-black { color: #000; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="bgLoader" accept="image/*" title="רקע">
    <select id="textColor">
        <option value="color-gold">זהב</option>
        <option value="color-black">שחור</option>
    </select>
    <select id="textFont">
        <option value="font-normal">כתב רגיל</option>
        <option value="font-formal">כתב רשמי</option>
        <option value="font-hand">כתב יד</option>
    </select>
    <button onclick="addTextBox()">הוסף טקסט</button>
    <input type="file" id="logoLoader" accept="image/*" title="לוגו">
</div>

<div id="canvas"></div>

<script>
    const canvas = document.getElementById('canvas');

    // העלאת רקע
    document.getElementById('bgLoader').onchange = e => {
        canvas.style.backgroundImage = `url(${URL.createObjectURL(e.target.files[0])})`;
    };

    // הוספת לוגו עם יכולת גרירה מלאה
    document.getElementById('logoLoader').onchange = e => {
        const div = document.createElement('div');
        div.className = 'item';
        // הסרנו את ה-pointer-events: none כדי שיהיה קל לתפוס את האלמנט
        div.innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:150px; display:block;">`;
        canvas.appendChild(div);
        makeDraggable(div);
    };

    function addTextBox() {
        const div = document.createElement('div');
        div.className = `item text-box ${document.getElementById('textColor').value} ${document.getElementById('textFont').value}`;
        div.innerHTML = `
            <span contenteditable="true" style="font-size:30px;">הקלד...</span>
            <input type="range" min="10" max="100" value="30" oninput="this.previousElementSibling.style.fontSize = this.value + 'px'">
        `;
        canvas.appendChild(div);
        makeDraggable(div);
    }

    function makeDraggable(el) {
        el.onmousedown = function(e) {
            // מאפשר לערוך טקסט או להזיז סליידר בלי להזיז את כל התיבה
            if(e.target.contentEditable === "true" || e.target.tagName === "INPUT") return;
            
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;
            
            function moveAt(pageX, pageY) {
                el.style.left = (pageX - shiftX - canvas.getBoundingClientRect().left) + 'px';
                el.style.top = (pageY - shiftY - canvas.getBoundingClientRect().top) + 'px';
            }
            
            function onMouseMove(e) { moveAt(e.pageX, e.pageY); }
            document.addEventListener('mousemove', onMouseMove);
            document.onmouseup = () => {
                document.removeEventListener('mousemove', onMouseMove);
            };
        };
    }
</script>
</body>
</html>
