<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STIA/DTIA Workspace</title>
    <style>
        body { margin: 0; background: #222; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .toolbar { position: sticky; top: 0; width: 100%; background: #000; padding: 15px; display: flex; gap: 10px; justify-content: center; z-index: 1000; color: white; flex-wrap: wrap; }
        
        /* המיכל המרכזי שמאפשר גלילה */
        #scroll-container { width: 100vw; height: calc(100vh - 70px); overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
        
        #workspace { 
            background: white; position: relative; box-shadow: 0 0 20px black;
            background-size: 100% 100%; /* הופך את הרקע לדינמי */
            background-position: center;
            background-repeat: no-repeat;
            flex-shrink: 0; /* מונע מהקנבס להתכווץ */
        }
        
        .item { position: absolute; padding: 5px; cursor: move; touch-action: none; min-width: 20px; }
        .item:hover { outline: 1px dashed #aaa; }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="setCanvasSize(297, 210)">A4 לרוחב</button>
    <button onclick="setCanvasSize(210, 297)">A4 לאורך</button>
    <label style="cursor:pointer; background:#555; padding:5px 10px; border-radius:3px;">הגדר רקע
        <input type="file" id="bgLoader" accept="image/*" style="display:none" onchange="uploadBg(event)">
    </label>
    <button onclick="addText()">+ טקסט</button>
    <label style="cursor:pointer; background:#555; padding:5px 10px; border-radius:3px;">+ לוגו
        <input type="file" id="logoLoader" accept="image/*" style="display:none" onchange="uploadImg(event)">
    </label>
    <button onclick="window.print()" style="background:green;">הדפס/PDF</button>
</div>

<div id="scroll-container">
    <div id="workspace" style="width: 297mm; height: 210mm;"></div>
</div>

<script>
    const workspace = document.getElementById('workspace');

    function setCanvasSize(w, h) {
        workspace.style.width = w + 'mm';
        workspace.style.height = h + 'mm';
    }

    function uploadBg(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            workspace.style.backgroundImage = `url('${event.target.result}')`;
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function uploadImg(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<img src="${event.target.result}" style="max-width:200px; display:block; pointer-events:none;">`;
            workspace.appendChild(div);
            makeDraggable(div);
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function addText() {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = '<div contenteditable="true" style="font-size:24px; outline:none; min-width:50px;">טקסט חדש</div>';
        workspace.appendChild(div);
        makeDraggable(div);
    }

    function makeDraggable(el) {
        el.onmousedown = el.ontouchstart = (e) => {
            if(e.target.getAttribute('contenteditable') === 'true') return;
            e.preventDefault();
            let startX = (e.clientX || e.touches[0].clientX) - el.offsetLeft;
            let startY = (e.clientY || e.touches[0].clientY) - el.offsetTop;
            const move = (e) => {
                el.style.left = ((e.clientX || e.touches[0].clientX) - startX) + 'px';
                el.style.top = ((e.clientY || e.touches[0].clientY) - startY) + 'px';
            };
            document.onmousemove = document.ontouchmove = move;
            document.onmouseup = document.ontouchend = () => {
                document.onmousemove = document.ontouchmove = null;
            };
        };
    }
</script>
</body>
</html>
