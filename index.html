<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>STIA/DTIA - חיתוך רקע חכם</title>
    <style>
        body { background: #222; display: flex; flex-direction: column; align-items: center; }
        .toolbar { background: #000; padding: 15px; color: white; display: flex; gap: 10px; }
        #workspace { background: white; width: 297mm; height: 210mm; position: relative; box-shadow: 0 0 20px black; }
        .item { position: absolute; cursor: move; padding: 5px; }
        .resizer { width: 12px; height: 12px; background: blue; position: absolute; right: 0; bottom: 0; cursor: se-resize; }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="document.getElementById('fileInput').click()">הוסף לוגו וגזור רקע חיצוני</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<div id="workspace"></div>

<script>
    document.getElementById('fileInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // דגימת צבע הפינה (זה הצבע שייחשב כ"רקע")
                const tr = data[0], tg = data[1], tb = data[2];
                
                // סריקה רק מהקצוות פנימה
                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const i = (y * canvas.width + x) * 4;
                        // אם הפיקסל קרוב מאוד לצבע הפינה, נהפוך אותו לשקוף
                        if (Math.abs(data[i] - tr) < 30 && Math.abs(data[i+1] - tg) < 30 && Math.abs(data[i+2] - tb) < 30) {
                            data[i+3] = 0;
                        } else {
                            // ברגע שפגשנו צבע שונה (הלוגו עצמו), נעצור את השורה הזו
                            break;
                        }
                    }
                }
                ctx.putImageData(imageData, 0, 0);
                
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<img src="${canvas.toDataURL()}"><div class="resizer"></div>`;
                document.getElementById('workspace').appendChild(div);
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    }
</script>
</body>
</html>
